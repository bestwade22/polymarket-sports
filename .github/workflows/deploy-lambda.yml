name: Deploy NBA Polymarket Bot

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'lambda_handlers/**'
      - 'infrastructure/**'
      - 'web/**'
      - '.github/workflows/deploy-lambda.yml'
      - 'requirements.txt'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-east-1' }}
  ECR_REPOSITORY: polymarket-sports-bot
  STACK_NAME: polymarket-sports

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compares the role's real trust policy against the OIDC token's
      # real claims and names the exact condition that failed. Without
      # this, a trust policy mismatch and a missing role produce the
      # same opaque STS error.
      #
      # This must never fail the job: it runs before the credential step
      # and a non-zero exit would skip it. The script exits 1 when it
      # finds a problem, so the exit code is swallowed here.
      - name: Diagnose OIDC trust policy
        if: always()
        continue-on-error: true
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set +e
          if [ -z "${ROLE_ARN}" ]; then
            echo "AWS_DEPLOY_ROLE_ARN is not set on this repository."
            echo "Set it under Settings -> Secrets and variables -> Actions -> Variables."
            exit 0
          fi
          python3 scripts/diagnose_oidc.py "$ROLE_ARN" || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-east-1' }}

      # The configure-aws-credentials action reports every OIDC failure
      # as "Not authorized to perform sts:AssumeRoleWithWebIdentity".
      # Calling STS directly surfaces the real error, which distinguishes
      # a bad trust policy from a missing role or an unknown provider.
      - name: Probe STS AssumeRoleWithWebIdentity
        if: always()
        continue-on-error: true
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set +e
          if [ -z "${ROLE_ARN}" ]; then
            echo "AWS_DEPLOY_ROLE_ARN is not set - skipping the STS probe."
            exit 0
          fi

          echo "=== Requesting an OIDC token from GitHub ==="
          TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))' 2>/dev/null)"
          if [ -z "$TOKEN" ]; then
            echo "Could not get an OIDC token. Check the workflow's id-token: write permission."
            exit 0
          fi
          echo "token: ${TOKEN:0:24}...(truncated)"
          echo

          echo "=== STS AssumeRoleWithWebIdentity ==="
          aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name "gh-actions-deploy" \
            --web-identity-token "$TOKEN" \
            --duration-seconds 900 2>&1
          echo "(exit code: $?)"
          echo
          echo "Common causes, in order of likelihood:"
          echo "  1. The trust policy still contains ACCOUNT_ID / OWNER placeholders."
          echo "  2. The trust policy's sub condition does not match the token's subject."
          echo "     This repo's subject is:"
          echo "     repo:bestwade22@31284603/polymarket-sports@1469031647:ref:refs/heads/main"
          echo "     Use a wildcard so it matches either subject format:"
          echo "     repo:bestwade22*polymarket-sports*:ref:refs/heads/main"
          echo "  3. The role name in AWS_DEPLOY_ROLE_ARN does not exist."
          echo "  4. The OIDC provider is not registered in this account."

      # Now that the role has been assumed, the trust policy can be read
      # for real. This is the version of the diagnosis that counts.
      - name: Verify the trust policy matches the token
        if: success() && steps.configure-aws-credentials.outcome == 'success'
        continue-on-error: true
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: python3 scripts/diagnose_oidc.py "$ROLE_ARN" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      - name: Ensure the ECR repository exists
        run: |
          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --image-scanning-configuration scanOnPush=true >/dev/null
            echo "Created ECR repository $ECR_REPOSITORY"
          else
            echo "ECR repository $ECR_REPOSITORY already exists"
          fi

      # One image backs all four Lambda functions and the Fargate listener,
      # so the code is built once and pushed to ECR twice: the Lambda base
      # image for the functions, the plain image for the ECS task.
      #
      # The images are ARM64, but the GitHub-hosted runner is x86_64. Plain
      # `docker build --platform linux/arm64` pulls the ARM64 layers and
      # then fails with "exec /bin/sh: exec format error", because the
      # runner has no ARM emulation registered. buildx plus the QEMU
      # binfmt handler below gives the builder a way to run ARM64
      # binaries, so the cross-build works.
      - name: Set up QEMU emulation for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the container images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}"

          aws ecr get-login-password \
            --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          for target in lambda fargate; do
            docker buildx build \
              --platform linux/arm64 \
              --target "$target" \
              --provenance=false \
              --sbom=false \
              -t "${IMAGE_URI}:${IMAGE_TAG}-${target}" \
              -t "${IMAGE_URI}:${target}" \
              -f infrastructure/Dockerfile \
              --push \
              .
          done

          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: SAM deploy
        working-directory: infrastructure
        env:
          CLOB_PRIVATE_KEY: ${{ secrets.CLOB_PRIVATE_KEY }}
          DEPOSIT_WALLET_ADDRESS: ${{ secrets.DEPOSIT_WALLET_ADDRESS }}
          API_NINJAS_KEY: ${{ secrets.API_NINJAS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # When set, the stack reads the credentials from this existing
          # secret instead of creating one - so the wallet key never has to
          # be pasted into GitHub.
          BOT_SECRET_ARN: ${{ vars.BOT_SECRET_ARN }}
          # Optional: reserved concurrency for the trade worker. Unset
          # means no reservation (the stack default of 0).
          TRADE_WORKER_CONCURRENCY: ${{ vars.TRADE_WORKER_CONCURRENCY }}
        run: |
          set -euo pipefail

          # SAM rejects an override whose value is empty ("PrivateKey= is
          # not a valid format"), so only the parameters that actually
          # have a value are passed. When BOT_SECRET_ARN is set the stack
          # reads the wallet credentials from that existing secret and
          # ignores the credential parameters entirely, so they are
          # correctly absent.
          PARAMS=(
            "ImageUri=${IMAGE_URI}"
            "ImageTag=${IMAGE_TAG}-lambda"
            "FargateImageUri=${IMAGE_URI}"
            "FargateImageTag=${IMAGE_TAG}-fargate"
            "DryRun=true"
          )

          # Name -> value pairs for the optional parameters.
          add_if_set() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              PARAMS+=("${name}=${value}")
            else
              echo "not set, skipping: ${name}"
            fi
          }

          add_if_set "BotSecretArn"          "${BOT_SECRET_ARN}"
          add_if_set "PrivateKey"           "${CLOB_PRIVATE_KEY}"
          add_if_set "DepositWalletAddress" "${DEPOSIT_WALLET_ADDRESS}"
          add_if_set "TelegramBotToken"     "${TELEGRAM_BOT_TOKEN}"
          add_if_set "TelegramChatId"       "${TELEGRAM_CHAT_ID}"

          # Reserved concurrency for the trade worker. Left unset by
          # default: AWS rejects a reservation that would drop the
          # account's UnreservedConcurrentExecutions below its minimum
          # (10 on a new account), so the stack default of 0 (no
          # reservation) is used unless this is explicitly set.
          add_if_set "TradeWorkerConcurrency" "${TRADE_WORKER_CONCURRENCY}"

          # The API Ninjas key is only passed when the stack creates its
          # own secret. With BOT_SECRET_ARN set, the shared secret already
          # holds API_NINJAS_KEY, and duplicating it here would leave a
          # copy of the key in the stack's parameter history.
          if [ -z "${BOT_SECRET_ARN}" ]; then
            add_if_set "ApiNinjasKey" "${API_NINJAS_KEY}"
          fi

          if [ -z "${BOT_SECRET_ARN}" ] && [ -z "${CLOB_PRIVATE_KEY}" ]; then
            echo "Neither BOT_SECRET_ARN nor CLOB_PRIVATE_KEY is set, so the"
            echo "stack has no wallet credentials. Set one of them."
            exit 1
          fi

          # A stack that failed and rolled back is stuck in
          # ROLLBACK_COMPLETE and cannot be updated:
          #   "Stack ... is in ROLLBACK_COMPLETE state and can not be
          #    updated."
          # Delete it first so the deploy starts from a clean slate. The
          # failed stack's resources were already rolled back, so nothing
          # is orphaned by this.
          STACK_STATUS="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "NOT_FOUND")"

          # A stack that was deleted still shows up in describe-stacks with
          # the status DELETE_COMPLETE. It cannot be updated either, but it
          # is already effectively gone, so treat it like a fresh deploy.
          if [ "$STACK_STATUS" = "DELETE_COMPLETE" ]; then
            STACK_STATUS="NOT_FOUND"
          fi

          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Stack is in ROLLBACK_COMPLETE - deleting it before deploy."
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
            echo "Waiting for the delete to finish..."
            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME"
            echo "Deleted."
          elif [ "$STACK_STATUS" = "DELETE_IN_PROGRESS" ]; then
            # A previous run's delete has not finished yet. Wait it out so
            # the deploy does not race the deletion.
            echo "Stack is being deleted - waiting for it to finish."
            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME"
          elif [ "$STACK_STATUS" != "NOT_FOUND" ]; then
            echo "Stack status is ${STACK_STATUS}; deploying over it."
          fi

          # ECS creates the AWSServiceRoleForECS service-linked role on the
          # first CreateCluster call. If an earlier attempt failed partway
          # through that creation, the role is left in the Failed state and
          # every subsequent CreateCluster fails with:
          #   "Unable to assume the service linked role. Please verify
          #    that the ECS service linked role exists."
          # A Failed SLR blocks creation until it is deleted, so clear it
          # out here.
          for slr_name in AWSServiceRoleForECS AWSServiceRoleForApplicationAutoScaling; do
            slr_path="/aws-service-role/ecs.amazonaws.com/$slr_name"
            slr_status="$(aws iam get-role \
              --role-name "$slr_path" \
              --query 'Role.RoleStatus' \
              --output text 2>/dev/null || echo "NONE")"

            if [ "$slr_status" = "FAILED" ]; then
              echo "Service-linked role $slr_name is in FAILED state - deleting it."
              aws iam delete-service-linked-role \
                --service-linked-role-name "$slr_path" || true
              # There is no IAM CLI waiter for service-linked role deletion,
              # so poll until get-role stops finding the role.
              for _ in $(seq 1 30); do
                sleep 2
                if ! aws iam get-role --role-name "$slr_path" \
                     >/dev/null 2>&1; then
                  echo "Deleted."
                  break
                fi
              done
            else
              echo "Service-linked role $slr_name: ${slr_status}"
            fi
          done

          sam deploy \
            --stack-name "$STACK_NAME" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --resolve-image-repos \
            --parameter-overrides "${PARAMS[@]}"

      # SAM image deploys leave old digests in ECR; the lifecycle policy
      # expires them.
      - name: Apply ECR lifecycle policies
        run: bash scripts/apply_ecr_lifecycle.sh polymarket-sports

      - name: Publish the static dashboard
        run: |
          set -euo pipefail
          BUCKET="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardBucketName'].OutputValue" \
            --output text)"
          if [[ -z "$BUCKET" || "$BUCKET" == "None" ]]; then
            echo "No dashboard bucket in the stack outputs; skipping."
            exit 0
          fi
          aws s3 sync web/ "s3://${BUCKET}/" --delete --exclude ".*"

      # CloudFront caches the static files at the edge for 24 hours (the
      # managed CachingOptimized policy), so a new upload in S3 is not
      # visible until the cached copies expire. Invalidate them so the
      # dashboard shows the new code straight after the deploy.
      - name: Invalidate the CloudFront cache
        run: |
          set -euo pipefail
          DISTRIBUTION="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardDistributionId'].OutputValue" \
            --output text 2>/dev/null || echo "")"
          if [[ -z "$DISTRIBUTION" || "$DISTRIBUTION" == "None" ]]; then
            echo "No dashboard distribution in the stack outputs; skipping."
            exit 0
          fi
          echo "Invalidating distribution $DISTRIBUTION"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" \
            --paths "/index.html" "/app.js" "/style.css" \
            --query "Invalidation.Id" --output text

      - name: Diagnose CloudFormation failure
        if: failure()
        run: |
          for stack in aws-sam-cli-managed-default "$STACK_NAME"; do
            echo "=== Stack status: $stack ==="
            aws cloudformation describe-stacks \
              --stack-name "$stack" \
              --query 'Stacks[0].[StackName,StackStatus]' \
              --output table 2>/dev/null || echo "(stack $stack not found)"
            echo "=== Recent events: $stack ==="
            aws cloudformation describe-stack-events \
              --stack-name "$stack" \
              --max-items 20 \
              --query 'StackEvents[].[Timestamp,ResourceStatus,LogicalResourceId,ResourceStatusReason]' \
              --output table 2>/dev/null || true
          done
